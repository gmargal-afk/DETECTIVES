</div>
<h1 class="box-title">GUÍA DIDÁCTICA PARA EL PROFESORADO</h1>
<button class="box-toggle box-toggle-on" title="Ocultar/Mostrar contenido"> <span>Ocultar/Mostrar contenido</span></button></header><div class="box-content"> <div id="20260521113528182T82" class="idevice_node text" data-idevice-path="../idevices/text/" data-idevice-type="text" data-idevice-component-type="json"><div class="exe-text-template"><div class="textIdeviceContent">
            <div class="exe-text-activity">
                <div><p><strong>Relación entre tareas y criterios de evaluación:</strong><strong></strong></p>
<p><strong>Tarea 1.</strong> Activación de conocimientos previos.</p>
<p><strong>C.E.1.1.</strong>Comprende textos e información sencilla.&nbsp;</p>
<p><br></p>
<p><strong>Tarea 2.</strong> Búsqueda guiada de información.&nbsp;</p>
<p><strong>C.E.2.</strong>Localiza información explícita en textos digitales.&nbsp;</p>
<p><br></p>
<p><strong>Tarea 3.&nbsp;</strong>Identificación de ideas clave.&nbsp;</p>
<p><strong>C.E.2.</strong>Identifica ideas principales y secundarias.&nbsp;</p>
<p><br></p>
<p><strong>Tarea 4.</strong> Elaboración de esquema o mapa conceptual.&nbsp;</p>
<p><strong>C.E.2. </strong>Organiza la información de forma estructurada.&nbsp;</p>
<p><br></p>
<p><strong>Tarea 5. </strong>Producción escrita.&nbsp;</p>
<p>C.E.3.Produce textos sencillos con apoyo.&nbsp;</p>
<p><br></p>
<p><strong>Tarea 6.</strong> Diseño del producto final.&nbsp;</p>
<p><strong>C.E.3.</strong> Planifica producciones digitales sencillas.&nbsp;</p>
<p><br></p>
<p><strong>Tarea 7. </strong>Elaboración del producto final.&nbsp;</p>
<p><strong>C.E.3.</strong>Elabora producciones digitales básicas.&nbsp;</p>
<p><br></p>
<p><strong>Tarea 8.</strong> Exposición y reflexión final.&nbsp;</p>
<p><strong>C.E.5. y C.E.6. </strong>Se expresa oralmente y utiliza las TIC de forma responsable.&nbsp;</p>
<p><br></p>
<p></p>
<p><strong>Recomendaciones:&nbsp;</strong></p>
<ul>
<li>Adaptar los textos al nivel competencial del alumnado.&nbsp;</li>
<li>Facilitar plantillas visuales y ejemplos previos.&nbsp;</li>
<li>Favorecer agrupamientos flexibles.&nbsp;</li>
<li>Proporcionar apoyos específicos al alumnado con dificultades lectoras o de comprensión.&nbsp;</li>
<li>Supervisar el uso seguro y responsable de las herramientas digitales.&nbsp;</li>
<li>Priorizar el proceso de aprendizaje sobre el resultado final.&nbsp;</li>
</ul>
<p><strong></strong><br></p>
<p><strong>Observaciones:&nbsp;</strong></p>
<p>Este proyecto está orientado al desarrollo práctico de la competencia digital mediante tareas cercanas a la realidad del alumnado. Se recomienda valorar no solo el producto final, sino también el proceso seguido, la autonomía, la capacidad de reflexión y el uso responsable de las herramientas digitales.</p>
<p>Es importante tener en cuenta la diversidad de niveles de competencia digital presentes en el aula, adaptando los apoyos necesarios para favorecer la participación de todo el alumnado.&nbsp;</p>
<p>Por último, la propuesta debe aplicarse con flexibilidad ante posibles incidencias técnicas, priorizando siempre la adquisición de competencias y el aprendizaje significativo por encima del dominio de herramientas concretas.&nbsp;</p><p class="clearfix"></p></div>
